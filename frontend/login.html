<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Log in - AdmitFlow</title>
</head>
<body>
  <header class="public-bar">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="brand" href="index.html">Admit<span class="brand-mark">Flow</span></a>
      <a class="btn btn-outline-primary btn-sm" href="register.html">Create account</a>
    </div>
  </header>

  <main class="auth-wrap">
    <h1 class="page-title mb-1">Log in</h1>
    <p class="text-muted mb-4">Continue tracking your admission.</p>
    <div id="alert-area"></div>

    <form id="login-form" class="panel" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
        <div class="invalid-feedback"></div>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="login-btn">Log in</button>
    </form>

    <p class="text-center text-muted mt-3">New here? <a href="register.html">Create an account</a></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
