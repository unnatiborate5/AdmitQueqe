<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Create account - AdmitFlow</title>
</head>
<body>
  <header class="public-bar">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="brand" href="index.html">Admit<span class="brand-mark">Flow</span></a>
      <a class="btn btn-outline-primary btn-sm" href="login.html">Log in</a>
    </div>
  </header>

  <main class="auth-wrap wide">
    <h1 class="page-title mb-1">Create your account</h1>
    <p class="text-muted mb-4">It takes a minute. You will enter your CAP details after logging in.</p>
    <div id="alert-area"></div>

    <form id="register-form" class="panel" novalidate>
      <div class="mb-3">
        <label for="fullName" class="form-label fw-semibold">Full name</label>
        <input type="text" class="form-control" id="fullName" name="fullName" autocomplete="name" maxlength="100" required>
        <div class="invalid-feedback"></div>
      </div>
      <div class="row">
        <div class="col-md-7 mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" maxlength="254" required>
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-md-5 mb-3">
          <label for="phone" class="form-label fw-semibold">Mobile number</label>
          <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel" inputmode="numeric" placeholder="10 digits" required>
          <div class="invalid-feedback"></div>
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required>
        <div class="invalid-feedback"></div>
        <div class="form-text">At least 8 characters, with a letter and a number.</div>
      </div>
      <div class="mb-4">
        <label for="confirmPassword" class="form-label fw-semibold">Confirm password</label>
        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
        <div class="invalid-feedback"></div>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="register-btn">Create account</button>
    </form>

    <p class="text-center text-muted mt-3">Already registered? <a href="login.html">Log in</a></p>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
