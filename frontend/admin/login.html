<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <title>Admin log in - AdmitFlow</title>
</head>
<body>
  <header class="admin-nav">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="brand" href="../index.html">Admit<span class="brand-mark">Flow</span><span class="admin-badge">Admin</span></a>
      <a class="small" href="../login.html">Student login</a>
    </div>
  </header>

  <main class="auth-wrap">
    <h1 class="page-title mb-1">College admin log in</h1>
    <p class="text-muted mb-4">For admission cell staff. Accounts are created by your administrator.</p>
    <div id="alert-area"></div>

    <form id="login-form" class="panel" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control" id="email" name="email" autocomplete="username" required>
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
        <div class="invalid-feedback"></div>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="login-btn">Log in</button>
    </form>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin/admin-common.js"></script>
  <script src="../js/admin/login.js"></script>
</body>
</html>
