<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <title>Appointments - AdmitFlow Admin</title>
</head>
<body>
  <div id="app-navbar"></div>
  <main class="container py-4">
    <div id="alert-area"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="page-title mb-1">Verification appointments</h1>
        <p class="text-muted mb-0">When and where students bring their original documents. Verification itself is done in person.</p>
      </div>
      <button type="button" class="btn btn-primary d-none" id="new-appt">Schedule appointment</button>
    </div>
    <section class="panel mb-3">
      <div class="pill-tabs mb-3" id="tabs" role="tablist" aria-label="Appointment status"></div>
      <div class="filter-bar">
        <div class="search">
          <label for="f-search" class="form-label small fw-semibold mb-1">Search</label>
          <input type="search" class="form-control" id="f-search" placeholder="Student name, email or application ID" maxlength="100" autocomplete="off">
        </div>
        <div>
          <label for="f-when" class="form-label small fw-semibold mb-1">When</label>
          <select class="form-select" id="f-when"><option value="">Any time</option><option value="today">Today</option><option value="upcoming">Today and later</option></select>
        </div>
        <div>
          <label for="f-date" class="form-label small fw-semibold mb-1">On date</label>
          <input type="date" class="form-control" id="f-date">
        </div>
        <div><button type="button" class="btn btn-outline-primary w-100" id="f-reset">Clear filters</button></div>
      </div>
    </section>
    <section class="panel table-panel" aria-label="Appointments" aria-live="polite">
      <div class="table-responsive"><table class="table admin-table align-middle">
        <thead><tr><th>Date and time</th><th>Student</th><th>Venue</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5"><div class="spinner-wrap py-4">Loading</div></td></tr></tbody>
      </table></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/admin/admin-common.js"></script>
  <script src="../js/admin/appointment-dialogs.js"></script>
  <script src="../js/admin/appointments.js"></script>
</body>
</html>
