<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <title>Students - AdmitFlow Admin</title>
</head>
<body>
  <div id="app-navbar"></div>
  <main class="container py-4">
    <div id="alert-area"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="page-title mb-1">Students</h1>
        <p class="text-muted mb-0">Search and filter student applications. Click a row to inspect and review it.</p>
      </div>
    </div>
    <form id="filters" class="panel mb-3" role="search" aria-label="Filter students">
      <div class="filter-bar">
        <div class="search">
          <label for="f-search" class="form-label small fw-semibold mb-1">Search</label>
          <input type="search" class="form-control" id="f-search" placeholder="Name, email, phone, application ID or college" maxlength="100" autocomplete="off">
        </div>
        <div>
          <label for="f-status" class="form-label small fw-semibold mb-1">Review status</label>
          <select class="form-select" id="f-status">
            <option value="">All</option><option value="pending">Pending review</option><option value="approved">Approved</option>
            <option value="rejected">Rejected</option><option value="correction_requested">Corrections requested</option><option value="not_started">Not started (no CAP details)</option>
          </select>
        </div>
        <div>
          <label for="f-verification" class="form-label small fw-semibold mb-1">Physical verification</label>
          <select class="form-select" id="f-verification">
            <option value="">All</option><option value="awaiting">Awaiting verification</option><option value="pending">Not verified</option>
            <option value="in_progress">In progress</option><option value="completed">Verified</option>
          </select>
        </div>
        <div>
          <label for="f-appointment" class="form-label small fw-semibold mb-1">Appointment</label>
          <select class="form-select" id="f-appointment">
            <option value="">All</option><option value="scheduled">Has appointment</option><option value="none">No appointment</option>
          </select>
        </div>
        <div>
          <label for="f-round" class="form-label small fw-semibold mb-1">CAP round</label>
          <select class="form-select" id="f-round"><option value="">All</option><option>Round 1</option><option>Round 2</option><option>Round 3</option><option>Special Round</option></select>
        </div>
        <div>
          <label for="f-sort" class="form-label small fw-semibold mb-1">Sort by</label>
          <select class="form-select" id="f-sort">
            <option value="recent">Newest first</option><option value="name">Name (A-Z)</option><option value="appointment">Appointment date</option>
          </select>
        </div>
        <div><button type="button" class="btn btn-outline-primary w-100" id="f-reset">Clear filters</button></div>
      </div>
    </form>
    <section class="panel table-panel" aria-label="Student list" aria-live="polite">
      <div class="table-responsive"><table class="table admin-table align-middle" id="students-table">
        <thead><tr><th>Student</th><th>Application</th><th>Review</th><th>Verification</th><th>Appointment</th><th>Progress</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6"><div class="spinner-wrap py-4">Loading</div></td></tr></tbody>
      </table></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/admin/admin-common.js"></script>
  <script src="../js/admin/students.js"></script>
</body>
</html>
