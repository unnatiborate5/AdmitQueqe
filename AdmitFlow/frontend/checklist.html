<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Checklist - AdmitFlow</title>
</head>
<body>
  <div id="app-navbar"></div>
  <main class="container py-4" style="max-width: 50rem;">
    <h1 class="page-title mb-1">Admission checklist</h1>
    <p class="text-muted mb-4">Update each item as you finish it. Your dashboard progress changes with it.</p>
    <div id="alert-area"></div>
    <div id="loading" class="spinner-wrap" role="status">
      <div class="spinner-border text-primary mb-2" aria-hidden="true"></div>
      <div>Loading your checklist</div>
    </div>
    <div id="checklist-content" class="d-none"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/checklist.js"></script>
</body>
</html>
